<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css">
            /* 예제 1: 스타일시트 기본 */
            #ex1 p { font-size: 10pt; }
            #ex1 h3 { color: red; background-color: #90ff90; }
            #ex1 h3:after { content: " (ⓒsblim)"; font-size: 10pt; background-color: yellow; }
            #ex1 strong, #ex1 .red1 { background-color: silver; }
            #ex1 .next { text-align: center; background-color: #B0ffff; }

            /* 예제 2: 박스모델 */
            #ex2 p { font-size: 10pt; line-height: 24pt; }
            #ex2 h3 { color: red; background-color: #90ff90; margin-left: 60px; margin-right: 60px; }
            #ex2 h3:after { content: " (ⓒsblim)"; font-size: 10pt; }
            #ex2 p { background-color: #ffff80; padding: 10px; border: medium dotted red; }
            #ex2 .next { line-height: 2pt; margin-left: 30%; padding: 8px; border: 4px double blue; }
            #ex2 strong, #ex2 .red1 { background-color: silver; margin: 10px; padding: 6px; border: 1px solid black; }

            /* 예제 3: display 속성 */
            /* 생략 */
            #ex3 p { display: inline; background-color: #ffff80; padding: 10px; border: thin dotted red; }
            #ex3 .next { display: inline; line-height: 12pt; margin-left: 30%; padding: 8px; border: 4px inset green; }
            #ex3 strong { display: none; background-color: silver; margin: 10px; padding: 6px; border: 1px solid black; }
            #ex3 .red1 { display: block; background-color: silver; padding: 6px; border: 1px solid black; }
        </style>
    </head>
    <body>
        <section id="ex1">
            <h3><strong>스타일시트</strong> 이해하기</h3>
            <p>
                이 예제는 <strong>박스모델</strong>의 개념을 설명합니다.<br>
                <span class="red1">클래스</span>와 ID로 스타일을 지정합니다.
            </p>
            <p class="next">다음 예제로 이어집니다.</p>
        </section>

        <hr>

        <section id="ex2">
            <h3><strong>스타일시트</strong> 이해하기</h3>
            <p>
                이 예제는 <strong>박스모델</strong>의 개념을 설명합니다.<br>
                <span class="red1">클래스</span>와 ID로 스타일을 지정합니다.
            </p>
            <p class="next">다음 예제로 이어집니다.</p>
        </section>

        <hr>

        <section id="ex3">
            <h3><strong>스타일시트</strong> 이해하기</h3>
            <p>
                이 예제는 <strong>박스모델</strong>의 개념을 설명합니다.<br>
                <span class="red1">클래스</span>와 ID로 스타일을 지정합니다.
            </p>
            <p class="next">다음 예제로 이어집니다.</p>
        </section>
    </body>
</html>
